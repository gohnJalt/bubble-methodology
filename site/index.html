<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Readings</title>
<meta name="description" content="Daily readings from separately validated market models: XU100 and lira risk, and real-price bubble tests for BIST 100, Nasdaq, FTSE 100 and Nikkei 225.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23161616'/%3E%3Cpath d='M3 11.5h10M3 8.5h6M3 5.5h8' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/plotly.js-cartesian-dist-min@4.1.1/plotly-cartesian.min.js" defer></script>
<style>
:root {
  --paper:#F7F7F5; --paper2:#EFEEEB; --ink:#161616; --ink2:#3D3D3B; --ink3:#6A6A67;
  --hair:#DEDDD9; --rule:#161616; --grid:#EAE9E5; --bar:#CFCEC9;
  --red:#C4382C; --red-bg:#F6E4E1; --hl:#ECE8DA;
  --sans:'Public Sans', ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:#141414; --paper2:#1D1D1C; --ink:#EDEDEA; --ink2:#C8C8C4; --ink3:#9A9A95;
    --hair:#2E2E2C; --rule:#EDEDEA; --grid:#222221; --bar:#3A3A38;
    --red:#EA6A5E; --red-bg:#35201D; --hl:#34301F;
  }
}
:root[data-theme="dark"] {
  --paper:#141414; --paper2:#1D1D1C; --ink:#EDEDEA; --ink2:#C8C8C4; --ink3:#9A9A95;
  --hair:#2E2E2C; --rule:#EDEDEA; --grid:#222221; --bar:#3A3A38;
  --red:#EA6A5E; --red-bg:#35201D; --hl:#34301F;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--paper); color:var(--ink); font:400 .9375rem/1.55 var(--sans);
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums lining-nums; }

::selection { background:var(--hl); color:var(--ink); }
* { scrollbar-width:thin; scrollbar-color:var(--hair) transparent; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:var(--hair); border:3px solid var(--paper); }
:focus-visible { outline:1.5px solid var(--ink); outline-offset:3px; }
a { color:var(--ink); text-decoration:underline; text-decoration-color:var(--hair); text-underline-offset:3px;
  text-decoration-thickness:1px; transition:text-decoration-color 150ms ease; }
a:hover { text-decoration-color:var(--ink); }
code { font:.85em ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--paper2); padding:.05rem .3rem; }

.wrap { max-width:1240px; margin:0 auto; padding:0 2.5rem; }
.skip { position:absolute; left:1rem; top:-3rem; z-index:10; background:var(--ink); color:var(--paper);
  padding:.5rem .8rem; font-weight:500; text-decoration:none; }
.skip:focus { top:1rem; }

/* masthead: name, lenses, issue date on one quiet line */
.mast-top { display:flex; align-items:baseline; gap:2.5rem; padding-top:1.75rem; }
.brand { font:600 1.0625rem/1 var(--sans); letter-spacing:-.01em; color:var(--ink); text-decoration:none; white-space:nowrap; }
.issue { margin-left:auto; font-size:.8125rem; color:var(--ink3); white-space:nowrap; }
.issue b { font-weight:500; color:var(--ink2); }
nav.lenses { display:flex; gap:1.6rem; flex:1 1 auto; overflow-x:auto; min-width:0;
  background:linear-gradient(to left, var(--paper) 30%, transparent) right / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 100% 50%, var(--hair), transparent) right / .7rem 100% no-repeat scroll; }
nav.lenses .grp { display:flex; gap:1.6rem; }
nav.lenses a { font-size:.875rem; color:var(--ink3); text-decoration:none; padding-bottom:.4rem; white-space:nowrap;
  box-shadow:inset 0 -1px 0 transparent; transition:color 150ms ease, box-shadow 150ms ease; }
nav.lenses a:hover { color:var(--ink); }
nav.lenses a[aria-current="page"] { color:var(--ink); box-shadow:inset 0 -1px 0 var(--ink); }

main.wrap { padding-top:3.5rem; padding-bottom:5rem; }
h1:focus { outline:none; }
h1, h2, h3 { margin:0; font-weight:500; letter-spacing:-.015em; text-wrap:balance; }
h1 { font-size:2.125rem; line-height:1.12; letter-spacing:-.025em; }
h2 { font-size:1.25rem; line-height:1.25; }
.lede { font-size:.9375rem; line-height:1.55; color:var(--ink3); max-width:64ch; margin:.5rem 0 0; }
.num { font-variant-numeric:tabular-nums; }
.muted { color:var(--ink3); }
.page-head { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:1rem 2rem; align-items:end; }

/* the four answers: one ruled row of figures */
.krs { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); border-top:1px solid var(--rule); margin-top:2.75rem; }
.kr { display:block; padding:1.1rem 1.5rem .2rem; color:inherit; text-decoration:none; transition:background 150ms ease; }
.kr:first-child { padding-left:0; }
.kr + .kr { border-left:1px solid var(--hair); }
a.kr .kq { transition:color 150ms ease; }
a.kr:hover .kq { color:var(--ink); text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--hair); }
.kq { font-size:.8125rem; color:var(--ink3); }
.kv { font:300 3.5rem/1 var(--sans); letter-spacing:-.04em; white-space:nowrap; margin:.75rem 0 .85rem; }
.kv small { font-size:.8125rem; font-weight:400; letter-spacing:0; color:var(--ink3); margin-left:.3rem; }
.kv.alert { color:var(--red); }
.kn { font-size:.8125rem; color:var(--ink3); margin-top:.3rem; }
.kr .err-line { font-size:.875rem; color:var(--red); margin-top:.9rem; }

/* state: a drawn circle plus the word; filled red only when a threshold is crossed */
.st { display:inline-flex; align-items:center; gap:.5rem; font-size:.8125rem; font-weight:500; white-space:nowrap; }
.st::before { content:""; width:.45rem; height:.45rem; border-radius:50%; box-shadow:inset 0 0 0 1.25px currentColor; flex:none; }
.st.ok { color:var(--ink); }
.st.warn { color:var(--ink); font-weight:600; } .st.warn::before { background:linear-gradient(90deg, currentColor 50%, transparent 50%); }
.st.alert { color:var(--red); } .st.alert::before { background:currentColor; }
.st.na { color:var(--ink3); }

/* exhibits */
.ex { margin:0; scroll-margin-top:1.5rem; }
.ex figcaption { display:block; }
.ex .t { font-size:.9375rem; font-weight:500; line-height:1.35; }
.ex .t .n { color:var(--ink3); font-weight:400; font-size:.8125rem; margin-right:.5rem; }
.ex .sub { font-size:.875rem; line-height:1.5; color:var(--ink3); margin:.25rem 0 0; max-width:74ch; }
.ex .plot { margin-top:1rem; }
.ex .src { font-size:.75rem; line-height:1.5; color:var(--ink3); margin:.6rem 0 0; }
.ex .src b { font-weight:500; color:var(--ink3); }
.ex.flash { animation:flash 1.6s ease-out; }
@keyframes flash { from { background:var(--hl); box-shadow:0 0 0 .8rem var(--hl); } to { background:transparent; box-shadow:0 0 0 .8rem transparent; } }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:4rem; }
.gap { margin-top:5.5rem; }
.section { margin-top:6rem; padding-top:1.4rem; border-top:1px solid var(--hair); }
.section > .page-head { margin-bottom:2rem; }

.fn { font:500 .7em/1 var(--sans); vertical-align:super; color:var(--ink3); background:none; border:0; padding:0 .1em; cursor:pointer; }
.fn:hover { color:var(--ink); text-decoration:underline; }
.notes { margin-top:5rem; padding-top:1rem; border-top:1px solid var(--hair); max-width:84ch; }
.notes h2 { font-size:.8125rem; font-weight:500; color:var(--ink3); letter-spacing:0; }
.notes ol { margin:.5rem 0 0; padding-left:1.4rem; font-size:.8125rem; line-height:1.55; color:var(--ink3); }
.notes li { margin:.35rem 0; padding:.1rem .3rem; transition:background 600ms ease; }
.notes li.on { background:var(--hl); }

/* tables: hairlines only */
.tbl { overflow-x:auto; margin-top:1rem;
  background:linear-gradient(to right, var(--paper) 30%, transparent) left / 2rem 100% no-repeat local,
    linear-gradient(to left, var(--paper) 30%, transparent) right / 2rem 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, var(--hair), transparent) left / .7rem 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, var(--hair), transparent) right / .7rem 100% no-repeat scroll; }
.tbl.vr td { white-space:normal; vertical-align:top; }
.tbl.vr td:last-child { white-space:nowrap; }
table { width:100%; border-collapse:collapse; font-size:.875rem; }
th { font-size:.75rem; font-weight:400; color:var(--ink3); text-align:right; padding:0 .7rem .6rem; vertical-align:bottom; white-space:nowrap; }
td { text-align:right; padding:.7rem .7rem; border-top:1px solid var(--hair); white-space:nowrap; }
tr:last-child td { border-bottom:1px solid var(--hair); }
th:first-child, td:first-child { text-align:left; padding-left:0; }
th:last-child, td:last-child { padding-right:0; }
td.l, th.l { text-align:left; }
td small { display:block; font-size:.75rem; color:var(--ink3); white-space:normal; }
td.wrap-ok { white-space:normal; min-width:16rem; }
tr.open td { color:var(--ink3); }
tr.lnk { cursor:pointer; }
tr.lnk:hover td { background:var(--paper2); }
td .big { font-size:1.375rem; font-weight:300; letter-spacing:-.025em; }
td .big.alert { color:var(--red); }
td .big.warn { font-weight:500; }
.tbl-note { font-size:.8125rem; line-height:1.45; color:var(--ink3); margin:.6rem 0 0; }

/* controls */
.seg { display:inline-flex; flex-wrap:wrap; gap:.15rem; }
.seg label { position:relative; }
.seg input { position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
.seg span { display:block; padding:.3rem .6rem; font-size:.8125rem; color:var(--ink3);
  box-shadow:inset 0 -1px 0 transparent; transition:color 150ms ease, box-shadow 150ms ease; }
.seg input:hover + span { color:var(--ink); }
.seg input:checked + span { color:var(--ink); box-shadow:inset 0 -1px 0 var(--ink); }
.seg input:focus-visible + span { outline:1.5px solid var(--ink); outline-offset:1px; }
.seg input:disabled { cursor:not-allowed; }
.seg input:disabled + span { color:var(--hair); }
.ctl { display:flex; flex-direction:column; gap:.3rem; align-items:flex-end; }
.ctl .lab { font-size:.75rem; color:var(--ink3); }

.callout { font-size:.875rem; line-height:1.5; color:var(--ink); background:var(--paper2); padding:.8rem 1rem;
  margin-top:1.2rem; max-width:84ch; }
.callout.err { background:var(--red-bg); }
.callout b { font-weight:600; }

.prose { max-width:68ch; }
.prose h2 { margin-top:2.8rem; font-size:1.25rem; }
.prose h3 { margin-top:2rem; font-size:1rem; font-weight:500; }
.prose p, .prose li { font-size:1rem; line-height:1.65; }
.prose b { font-weight:600; }
.prose ol, .prose ul { padding-left:1.25rem; }
.prose li { margin:.45rem 0; }
.prose li::marker { color:var(--ink3); }
.prose .coda { margin-top:2.8rem; padding-top:1rem; border-top:1px solid var(--hair); color:var(--ink3); }
.part { margin-top:4rem; padding-top:1rem; border-top:1px solid var(--hair); }

.foot { background:linear-gradient(var(--hair), var(--hair)) top center / calc(100% - 5rem) 1px no-repeat;
  padding-top:1.1rem; padding-bottom:2.5rem; font-size:.75rem; color:var(--ink3);
  display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }

.skel { background:linear-gradient(90deg, var(--paper2), var(--grid), var(--paper2)); background-size:200% 100%;
  animation:sk 1.4s linear infinite; height:1rem; margin:.6rem 0; }
@keyframes sk { to { background-position:-200% 0; } }

@media (max-width:1000px) {
  .row2 { grid-template-columns:minmax(0,1fr); gap:4rem; }
  .mast-top { flex-wrap:wrap; gap:.9rem 2rem; }
  nav.lenses { order:3; flex-basis:100%; }
  .krs { grid-template-columns:1fr 1fr; }
  .kr:nth-child(3) { padding-left:0; border-left:0; }
  .kr:nth-child(n+3) { border-top:1px solid var(--hair); }
}
@media (max-width:640px) {
  .wrap { padding:0 1rem; }
  .foot { background-size:calc(100% - 2rem) 1px; }
  .mast-top { padding-top:1.1rem; }
  main.wrap { padding-top:2.2rem; }
  h1 { font-size:1.75rem; }
  .krs { margin-top:1.8rem; }
  .kr { padding:.9rem .9rem .2rem; }
  .kv { font-size:2.25rem; margin:.55rem 0 .6rem; }
  .st { white-space:normal; align-items:baseline; }
  .page-head { grid-template-columns:minmax(0,1fr); }
  .ctl { align-items:flex-start; }
  .gap { margin-top:4rem; }
  .section { margin-top:4.5rem; }
}
@media (prefers-reduced-motion:reduce) { *, *::before { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<a class="skip" href="#/" id="skip">Skip to content</a>
<header class="mast wrap">
  <div class="mast-top">
    <a class="brand" href="#/" id="brand">Market Readings</a>
    <nav class="lenses" id="nav" aria-label="Lenses"></nav>
    <span class="issue" id="issue">&nbsp;</span>
  </div>
</header>
<main id="main" class="wrap" tabindex="-1"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%"></div></main>
<footer class="foot wrap" id="foot"></footer>
<script>
const NAME = "Market Readings";           // working name: change it here only
const WINDOWS = [12, 24, 36, 60, 84, 120, 240, 360];
const ORDER = ["turkey", "new_york", "london", "asia"];   // Turkey first: the only market with a daily lens
const SERIES = { E:"XU100 (TRY)", USD:"XU100 (USD)", F:"USDTRY (long USD)" };
const CFG = { displayModeBar:false, responsive:true };
let V = null, R = null, VERR = null, RERR = null, NOTES = [], SYNC = [];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fin = x => x !== null && x !== undefined && Number.isFinite(x);
const lastFin = a => { for (let i = a.length - 1; i >= 0; i--) if (fin(a[i])) return a[i]; return NaN; };
const minus = s => s.replace(/^-/, "−");
const sign = x => (x >= 0 ? "+" : "−") + Math.abs(x).toFixed(2);
const pc = (x, nd = 2) => fin(x) ? minus(x.toFixed(nd)) + "%" : "—";
const wlabel = w => w >= 12 ? `${w / 12}y` : `${w}m`;
const monthName = ym => new Date(ym + "-15").toLocaleString("en-GB", { month:"short", year:"numeric" });
const dayName = (d, wd = false) => new Date(d + "T12:00:00Z").toLocaleDateString("en-GB",
  { ...(wd ? { weekday:"short" } : {}), day:"numeric", month:"short", year:"numeric", timeZone:"UTC" });
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------------------------------------------------------------- valuation model (mirrors build.py / data.py)
function state(z, crit) {   // 'elevated' is within 1 of the threshold
  if (!fin(z)) return "n/a";
  return z > crit ? "bubble" : z > crit - 1 ? "elevated" : "normal";
}
const band = x => !fin(x) ? "n/a" : x < -1 ? "tight" : x < 1 ? "neutral" : "loose";
const stCls = s => ({ bubble:"alert", elevated:"warn", normal:"ok" })[s] || "na";
const st = (s, word) => `<span class="st ${stCls(s)}">${esc(word || s)}</span>`;
function reading(m, win) { const w = win || m.window, r = m.windows[w]; return r ? { w, ...r } : null; }
function critFor(w) {
  for (const m of Object.values(V.markets)) if (m.windows && m.windows[w]) return m.windows[w].crit;
  return NaN;
}

// ---------------------------------------------------------------- risk readings (from risk.json)
const H = () => R.hist;
const nSess = () => R.hist.date.length;
function breaches(k, a, from = 0, to = nSess()) {
  const r = H()[`r_${k}`], v = H()[`var${a === "0.01" ? 1 : 25}_${k}`];
  let n = 0, hit = 0;
  for (let i = from; i < to; i++) if (fin(r[i]) && fin(v[i])) { n++; if (r[i] <= v[i]) hit++; }
  return { n, hit };
}
function periodRange(code) {
  const p = H().period; const a = p.indexOf(code), b = p.lastIndexOf(code);
  return a < 0 ? null : [a, b + 1];
}
function riskAge() {   // calendar days since the last session in risk.json
  return Math.round((Date.now() - Date.parse(R.asof + "T18:00:00+03:00")) / 864e5);
}

// ---------------------------------------------------------------- routing
function route() {
  const [path, q] = location.hash.replace(/^#\/?/, "").split("?");
  const p = new URLSearchParams(q), w = Number(p.get("w"));
  return { page:path || "", win:WINDOWS.includes(w) ? w : null, s:p.get("s") };
}
const href = (page, win) => `#/${page}${win ? `?w=${win}` : ""}`;

function nav({ page, win }) {
  const short = { "Nasdaq Composite":"Nasdaq" };
  const vm = ORDER.filter(k => V && V.markets[k]).map(k => [k, short[V.markets[k].index] || V.markets[k].index]);
  const g = (label, items) => `<div class="grp" aria-label="${label || "Pages"}">` +
    items.map(([k, t]) => `<a href="${href(k, V && V.markets[k] ? win : null)}"${k === page ? ' aria-current="page"' : ""}>${esc(t)}</a>`).join("") + "</div>";
  $("#nav").innerHTML = g("", [["", "Overview"]]) + g("Risk, daily", [["risk", "XU100 and lira"]]) +
    (vm.length ? g("Valuation, monthly", vm) : "") + g("", [["method", "Methodology"]]);
}

// ---------------------------------------------------------------- exhibit scaffolding
function fn(text) {   // a footnote: numbered per page, listed under Notes
  NOTES.push(text);
  return `<button type="button" class="fn" data-note="${NOTES.length}" aria-label="Note ${NOTES.length}">${NOTES.length}</button>`;
}
function exhibit(n, id, title, sub, body, src) {
  return `<figure class="ex" id="ex-${id}"><figcaption><div class="t"><span class="n">Exhibit ${n}</span>${title}</div>` +
    (sub ? `<p class="sub">${sub}</p>` : "") + `</figcaption>${body}` +
    (src ? `<p class="src">${src}</p>` : "") + "</figure>";
}
const plot = (id, label) => `<div class="plot" role="img" aria-label="${esc(label)}"><div id="${id}"></div></div>`;
function notesBlock() {
  return NOTES.length ? `<section class="notes" aria-label="Notes"><h2>Notes</h2><ol>` +
    NOTES.map((t, i) => `<li id="note-${i + 1}">${t}</li>`).join("") + "</ol></section>" : "";
}
function riskStale() {
  if (!R) return "";
  const age = riskAge();
  return age > 4 ? `<div class="callout"><b>Risk readings are ${age} days old.</b> The last session in the feed is ` +
    `${dayName(R.asof)}; the daily run has not published since. Numbers below are as of that close.</div>` : "";
}
function valStale() {
  const s = Object.keys((V && V.stale) || {});
  return s.length ? `<div class="callout"><b>Valuation is serving cached data.</b> Refresh failed for ` +
    `${s.map(k => `<code>${esc(k)}</code>`).join(", ")}.</div>` : "";
}

// ---------------------------------------------------------------- charts
function C() {
  return { ink:css("--ink"), ink2:css("--ink2"), ink3:css("--ink3"), paper:css("--paper"), hair:css("--hair"),
    rule:css("--rule"), series:css("--ink"), bar:css("--bar"), red:css("--red"), grid:css("--grid") };
}
function layout(height, extra = {}) {
  const c = C();
  return {
    height, paper_bgcolor:c.paper, plot_bgcolor:c.paper,
    font:{ family:"Public Sans, sans-serif", size:12, color:c.ink3 },
    margin:{ l:46, r:12, t:12, b:30 }, hovermode:"x unified",
    hoverlabel:{ bgcolor:c.paper, bordercolor:c.rule, font:{ family:"Public Sans, sans-serif", size:12, color:c.ink } },
    showlegend:false,
    legend:{ orientation:"h", y:1.0, x:0, yanchor:"bottom", font:{ size:12, color:c.ink2 }, bgcolor:"rgba(0,0,0,0)" },
    xaxis:{ type:"date", showgrid:false, showline:true, linecolor:c.rule, ticks:"outside", tickcolor:c.rule, ticklen:4,
      tickfont:{ size:11, color:c.ink3 }, spikemode:"across", spikecolor:c.ink3, spikethickness:1, spikedash:"solid" },
    yaxis:{ showgrid:true, gridcolor:c.grid, zeroline:false, tickfont:{ size:11, color:c.ink3 }, ticksuffix:"",
      title:{ font:{ size:11, color:c.ink3 } } },
    ...extra,
  };
}
const hline = (y, color, dash, yref = "y") => ({ type:"line", xref:"paper", x0:0, x1:1, yref, y0:y, y1:y,
  line:{ color, width:1, dash } });
function closeRule(x, label) {   // the one "last close" rule every daily chart shares
  const c = C();
  return { shape:{ type:"line", xref:"x", x0:x, x1:x, yref:"paper", y0:0, y1:1, line:{ color:c.ink, width:1 } },
    ann:{ xref:"x", x:x, yref:"paper", y:1, xanchor:"right", yanchor:"top", showarrow:false, text:label,
      font:{ size:11, color:c.ink }, bgcolor:c.paper, borderpad:2 } };
}
function periodMarks(x0) {   // holdout span (seen once) and the live start, on every daily chart
  const c = C(), h = H(), ho = periodRange("h"), shapes = [], anns = [];
  // a window lying wholly inside holdout+live gets no fill (it would grey the whole plot); the caption says so
  if (ho && h.date[ho[0]] > x0) {
    const a = h.date[ho[0]];
    shapes.push({ type:"rect", xref:"x", x0:a, x1:h.date[ho[1] - 1], yref:"paper", y0:0, y1:1, fillcolor:c.grid,
      opacity:.9, line:{ width:0 }, layer:"below" });
    anns.push({ xref:"x", x:a, yref:"paper", y:1, xanchor:"left", yanchor:"top", showarrow:false,

function aboveOnly(x, z, crit) {   // the stretch of a z line above its threshold, cut at the crossing
  const t = x.map(d => Date.parse(d + "-01")), X = [], Y = [];
  const iso = ms => new Date(ms).toISOString().slice(0, 10);
  for (let i = 0; i < z.length; i++) {
    const a = z[i - 1], b = z[i], up = fin(b) && b > crit;
    if (i && fin(a) && fin(b) && (a > crit) !== up) { X.push(iso(t[i - 1] + (t[i] - t[i - 1]) * (crit - a) / (b - a))); Y.push(crit); }
    X.push(x[i]); Y.push(up ? b : null);
  }
  return { X, Y };
}

      exhibit(4, "val", "Real price against its own trend, four indices",
        `Each index deflated by its own CPI and measured against a rolling linear trend. z above the threshold is a bubble state; within 1 of it, elevated.`,
        t + (loaded.length > 1 ? plot("x-cross", "z-score history for every index on one axis; stretches above threshold in red") : ""),
        `<b>Source:</b> Yahoo Finance; FRED, ONS, e-Stat, CBRT EVDS. <b>Model:</b> Bubble Methodology, leverage-corrected rolling z, t-threshold. ` +
        `<b>Validation:</b> windows chosen on pre-fixed criteria (rank correlation with forward real returns).`) + "</section>";
    $("#main").innerHTML = html + notesBlock();
    if (loaded.length > 1) crossChart($("#x-cross"), loaded);
  } else $("#main").innerHTML = html + notesBlock();
  if (R) {
    stressChart($("#x-stress"), Math.max(0, nSess() - 504), 330);
    varChart($("#x-breach"), "E", Math.max(0, nSess() - 250), 300);
  }
}

function pageRisk(sel) {

  const per = [["v", "Validation, 2013–19", "blind"], ["h", "Holdout, 2020–26", "seen once"], ["l", "Live", `since ${dayName(R.live0)}`]];
  const btab = `<div class="tbl"><table><thead><tr><th class="l">Period</th><th>Sessions</th><th>1% breaches</th><th>Rate</th>` +
    `<th>2.5% breaches</th><th>Rate</th></tr></thead><tbody>` + per.map(([c, t, s]) => {
      const pr = periodRange(c); if (!pr) return "";
      const a = breaches(k, "0.01", ...pr), b = breaches(k, "0.025", ...pr);
      const rt = x => x.n ? (100 * x.hit / x.n).toFixed(2) + "%" : "—";
      return `<tr><td>${t}<small>${s}</small></td><td class="num">${a.n}</td><td class="num">${a.hit}</td><td class="num">${rt(a)}</td>` +
        `<td class="num">${b.hit}</td><td class="num">${rt(b)}</td></tr>`;
    }).join("") + `</tbody></table></div><p class="tbl-note">A calibrated 1% VaR breaks on about 1% of sessions, a 2.5% VaR on about 2.5%.</p>`;
  const html = `<div class="page-head"><div><h1 tabindex="-1">XU100 and the lira</h1>` +
    `<p class="lede">XU100 in lira and USDTRY modelled jointly, so risk in dollars includes the currency. Readings after the ` +
    `${dayName(R.asof, true)} close, for the next session.</p></div></div>` + riskStale() +
    `<div class="gap" style="margin-top:3rem">` +
    exhibit(1, "r-stress", "Stress gauge since 2013",
      `Percentile of the XU100-in-USD volatility forecast; the flag turns on after ${R.m} sessions above ${(100 * R.tau).toFixed(1)}. ` +
      `Triangles mark dated stress events${fn("Event list fixed before scoring (jump-model data/events.csv). Onset dates; some are approximate.")}. ` +
      `Today: <b>${(100 * n.pct).toFixed(1)}</b>, ${n.flag ? "<b>flag on</b>" : "flag off"}.`,
      plot("r-stress", "Stress percentile since 2013 with events, holdout period marked"),
      `<b>Model:</b> ${n.flag_model}, refit every 21 sessions. <b>Validation:</b> holdout 7 of 7 events caught, median lag 2 sessions; ` +
      `the 2016 coup was caught 6 sessions late.`) + "</div>" +
    `<div class="row2 gap">` +
    exhibit(2, "r-one", "One-day VaR and ES, next session", `Lower tail, log return.`, riskTable(),
      `<b>Model:</b> ${esc(n.var_model)}, ν = ${n.nu}, fitted on ${n.fit_n.toLocaleString("en-GB")} sessions. Forecast daily sd: ` +
      `XU100 TRY ${n.sd.E.toFixed(2)}%, USDTRY ${n.sd.F.toFixed(2)}%, XU100 USD ${n.sd.USD.toFixed(2)}%.`) +
    exhibit(3, "r-ten", "Ten-day VaR and ES, XU100 only",
      `Sum of the next ${R.horizon10} sessions. Not blind: chosen after its backtest was seen, so the only honest test is live.` +
      fn(`Removed if, over its last 25 non-overlapping ${R.horizon10}-day windows, it breaks ≥ 2 times at 1% or ≥ 3 times at 2.5%. USDTRY failed the ten-day backtest and is never shown.`),

      plot("r-jump", "Probabilities of equity, FX and co-jumps per session"), `<b>Model:</b> ${esc(n.var_model)} jump posterior. <b>Validation:</b> the §8.8 battery did not support the jump component; descriptive only.`) +

function validation() {
  const rows = [
    ["Holdout 2020–26, one shot", "Stress flag detection", "7 of 7 events, 0.30 false-alarm episodes a year", "pass"],
    ["Holdout 2020–26, one shot", "1-day VaR coverage", "2 of 12 rejections (GJR-t: 7)", "pass"],
    ["Holdout 2020–26, one shot", "Expected shortfall", "Fails on XU100 (TRY), Z2 p = 0.008", "fail"],
    ["Holdout 2020–26, one shot", "Log score vs GJR-t", "Fails on USDTRY and XU100 (USD); thin Gaussian tails, 21 Dec 2021", "fail"],
    ["Student-t components", "Replace Gaussian VaR/ES", "Passes all 4 checks; gains not significant; holdout not blind", "pass, not blind"],
    ["Ten-day VaR/ES", "Monte Carlo vs √10 and GJR-t", "Fails on USDTRY; XU100 shipped under a live kill rule", "fail"],
    ["Robustness battery", "Bootstrap, rolling windows, signs, PIT", "12 of 16 pass; jump component not supported", "partial"],
  ];
  const cls = s => s === "pass" ? "ok" : s === "fail" ? "alert" : "na";
  return `<div class="tbl vr"><table><thead><tr><th class="l">Study</th><th class="l">What it tested</th><th class="l">Result</th><th class="l">Verdict</th></tr></thead><tbody>` +
    rows.map(r => `<tr><td>${r[0]}</td><td class="l">${r[1]}</td><td class="l">${r[2]}</td><td class="l"><span class="st ${cls(r[3])}">${r[3]}</span></td></tr>`).join("") +
    `</tbody></table></div><p class="tbl-note">Source: jump-model DESIGN.md §8.4–8.8 and §13, 28 Sep 2026.</p>`;
}

function pageMarket(m, win) {
  if (m.error) {

  const r = reading(m, win);

  let html = `<div class="page-head"><div><h1 tabindex="-1">${esc(m.index)}</h1><p class="lede">Valuation lens, monthly. Real ${m.ccy}, ` +

    `<tbody><tr><td>${st(s)}</td><td class="num"><span class="big ${stCls(s)}">${fin(z) ? sign(z) : "—"}</span></td><td class="num">${r.crit.toFixed(2)}<small>${wlabel(r.w)} window</small></td>` +
    `<td class="num">${fin(ov) ? sign(ov) : "—"}<small>${fin(ov) ? band(ov) : "not available"}</small></td>` +

      `Log real price against the trend fitted to the ${r.w} months before each month; below, z against its threshold. Red spans are bubble episodes.` +
      fn("Each month is removed from its own trend fit before being measured against it (leverage correction), so z is comparable across windows. Nothing after month t is used for month t."),
      plot("main-chart", `${m.index} log real price against its rolling trend, with z below`),
      `<b>Source:</b> Yahoo Finance; ${esc(m.ccy)} CPI. <b>Model:</b> Bubble Methodology, t(${r.w - 3}) threshold. <b>Validation:</b> ${m.weak ? "weakest market; restricted after seeing the result" : "window chosen on pre-fixed criteria"} (results/window_study.csv).`) + "</div>" +
    `<div class="row2 gap">` +
    exhibit(2, "v-ep", "Episodes", `A run of flagged months is one event. Drawdown runs from the episode's real peak over the following 24 months.`,
      r.episodes.length ? `<div class="tbl"><table><thead><tr><th class="l">Entered</th><th>z at entry</th><th>Months</th><th>Real drawdown</th></tr></thead><tbody>` +
        r.episodes.map(e => `<tr${e.open ? ' class="open"' : ""}><td>${e.entered}</td><td class="num">${e.z.toFixed(2)}</td>` +
          `<td class="num">${e.months}${e.running ? "<small>running</small>" : ""}</td>` +
          `<td class="num">${e.dd === null ? "—" : pc(e.dd, 1)}${e.open ? "<small>so far</small>" : ""}</td></tr>`).join("") + "</tbody></table></div>" +
        (r.episodes.some(e => e.open) ? `<p class="tbl-note">Grey rows are not settled: fewer than 24 months have passed since the episode ended.</p>` : "")
      : `<p class="tbl-note">No episode at this window: the reading has never crossed its threshold.</p>`,

    exhibit(3, "v-macro", "Macro overlay components",

  $("#main").innerHTML = html + notesBlock();

function render() {
  const rt = route();

  nav(rt);

});
document.addEventListener("change", e => {
  const rt = route();
  if (e.target.name === "w") location.hash = href(rt.page, Number(e.target.value) || null);
  if (e.target.name === "s") location.hash = `#/risk?s=${e.target.value}`;
});
$("#skip").addEventListener("click", e => { e.preventDefault(); $("#main h1")?.focus(); });
window.addEventListener("hashchange", () => {
  const moved = route().page !== lastPage;
  const y = window.scrollY;
  render();
  if (moved) { window.scrollTo(0, 0); $("#main h1")?.focus({ preventScroll:true }); }
  else window.scrollTo(0, y);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { const y = scrollY; render(); scrollTo(0, y); });

async function get(url) {
  const res = await fetch(url, { cache:"no-cache" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}
window.addEventListener("DOMContentLoaded", async () => {
  $("#brand").textContent = NAME;
  const [v, r] = await Promise.allSettled([get("data.json"), get("risk.json")]);
  if (v.status === "fulfilled") V = v.value; else VERR = v.reason.message;
  if (r.status === "fulfilled") R = r.value; else RERR = r.reason.message;
  if (!V && !R) {
    $("#main").innerHTML = `<h1>${NAME}</h1><div class="callout err"><b>No readings could be loaded.</b> Valuation: ${esc(VERR)}. Risk: ${esc(RERR)}. Reload to try again.</div>`;
    return;
  }
  $("#issue").innerHTML = R ? `After the <b>${dayName(R.asof)}</b> close` : `Valuation rebuilt ${esc(V.built)}`;
  $("#foot").innerHTML = `<span>${NAME}. Statistical readings, not advice or forecasts of returns.</span>` +
    `<span>${R ? `Risk published ${esc(R.built)}` : "Risk unavailable"} · ${V ? `Valuation rebuilt ${esc(V.built)}` : "Valuation unavailable"}</span>`;
  render();
});

<template id="method">
<article class="prose">
<h1 tabindex="-1">Methodology</h1>
<p class="lede">Two lenses, each validated on its own terms. They are shown side by side and never blended, so one model's failure cannot hide inside another's number.</p>

<section class="part">
<h2>Risk lens: XU100 and the lira, daily</h2>
<ol>
<li><b>What is modelled.</b> Daily log returns of XU100 in lira and of USDTRY, jointly, from August 2008. USDTRY is the Bloomberg BFIX 18:00 Istanbul fixing, matched to the BIST close. XU100 in dollars is the lira return minus the USDTRY return.</li>
<li><b>Model.</b> A bivariate GJR-GARCH with jumps: equity-only, FX-only and simultaneous co-jumps. A regime-switching version was built and tested; information criteria chose a single regime, and extra regimes on top of GARCH were not identifiable. VaR and ES use Student-t components (MSGJ1-t); the stress flag uses the Gaussian model (MSGJ1). Both refit every 21 sessions.</li>
<li><b>Stress flag.</b> The model's XU100-in-USD volatility forecast is ranked against its own history. The flag turns on after 3 consecutive sessions above the 92.5th percentile. Among the signals scored against dated stress events, this ranked best (AUC 0.90).</li>
<li><b>VaR and ES.</b> One session ahead, lower tail only, as backtested. For USDTRY the lower tail is the loss from holding dollars; the depreciation tail is not reported.</li>
<li><b>Ten days.</b> For XU100 only, by Monte Carlo from the same model. It was chosen after its backtest had been seen, so it is not blind: it is removed automatically if it breaks too often live.</li>
<li><b>Jumps and the lira share.</b> Jump probabilities are the posterior that a session's return contained each type of jump. The lira share is the part of the dollar variance forecast that comes from USDTRY.</li>
</ol>
<h3>Validation record</h3>
<div id="vrec"></div>
<h3>Limitations</h3>
<ul id="caveats"><li>Risk readings not loaded.</li></ul>
</section>

<section class="part">
<h2>Valuation lens: Bubble Methodology, monthly</h2>
<ol>
<li><b>Real price.</b> The monthly mean of daily closes, divided by that market&rsquo;s own CPI, then logged. Every market uses its <b>local</b> index and <b>local</b> CPI: no currency conversion, no special cases.</li>
<li><b>Rolling trend.</b> For each month <i>t</i>, a straight line is fitted to the <i>W</i> months <b>ending at</b> <i>t</i>. Nothing after <i>t</i> is ever used.</li>
<li><b>Leverage correction.</b> Month <i>t</i> is <b>removed from its own fit</b> before being measured against it. The last point of a linear fit is its highest-leverage point, so an uncorrected residual there is shrunk by <code>sqrt(1-h)</code>: about 16% at a 12-month window, under 1% at 240. Without this, z from different windows is not comparable.</li>
<li><b>z.</b> The deviation divided by its own standard error, distributed <b>t(W&minus;3)</b> under a trend-stationary null.</li>
<li><b>Threshold.</b> <code>zcrit(W)</code> carries the same tail probability as 2&sigma; on a normal at that window&rsquo;s degrees of freedom: 2.32 at W=12, 2.01 at W=360.</li>
<li><b>State.</b> <i>Bubble</i> when z exceeds the threshold, <i>elevated</i> within 1 of it, otherwise <i>normal</i>.</li>
</ol>
<h3>The last reading is provisional</h3>
<p>The series runs to the current month, so the newest reading is marked provisional. The month is still trading, and CPI publishes a month or two behind price; until it prints, the last published CPI is carried forward for at most three months. That overstates real price by the inflation not yet reported: immaterial at 2% a year, material in Turkey.</p>
<h3>Window lengths</h3>
<p>The Nasdaq Composite reads at a 7-year window, the other three at 10 years, chosen against criteria fixed before results were read: the rank correlation between z and subsequent real returns (<code>results/window_study.csv</code>). The original 20-year default was dropped: on the Nasdaq it was wrong-signed while flagging 6.4&times; the rate its own threshold claims.</p>
<h3>The macro overlay</h3>
<p>Real policy rate (negated), credit growth and curve slope, each ranked against its own trailing decade, higher meaning looser. It is a <b>separate</b> signal: it never enters z, never changes the state, and has not been tested for predictive power.</p>
<h3>Limitations</h3>
<ul>
<li><b>Trend-stationarity is a strong assumption.</b> The test cannot separate a bubble from a structural break or a genuine repricing of earnings power.</li>
<li><b>This is not a timing signal.</b> On the Nasdaq at a 20-year window the state turned on in 1995, four years before the peak.</li>
<li><b>No multiple-testing correction.</b> Eight windows across four markets over hundreds of months is a great many tests. The window-sensitivity strip exists to make that visible.</li>
<li><b>The Nikkei is restricted to 1990 onward, and is still weak.</b> That restriction was chosen after seeing the result.</li>
<li><b>Headline CPI is a choice, and Turkish CPI is contested.</b> The official series is used.</li>
</ul>
</section>
<p class="coda">These models measure statistical deviation and risk. They do not forecast returns and say nothing about what to do.</p>
</article>
</template>
